# Use the complete VS 2026 Build Tools installation for Rust linking AND cc-rs.
# The VS 2026 Community 14.51 installation on this machine lacks C++ headers/libs.
# Keep one configuration at the workspace root so both cargo --manifest-path
# and commands launched by Tauri from src-tauri use exactly the same toolchain.

[target.x86_64-pc-windows-msvc]
linker = "C:/Program Files (x86)/Microsoft Visual Studio/18/BuildTools/VC/Tools/MSVC/14.50.35717/bin/Hostx64/x64/link.exe"
rustflags = [
  "-L", "native=C:/Program Files (x86)/Microsoft Visual Studio/18/BuildTools/VC/Tools/MSVC/14.50.35717/lib/x64",
  "-L", "native=C:/Program Files (x86)/Windows Kits/10/Lib/10.0.26100.0/ucrt/x64",
  "-L", "native=C:/Program Files (x86)/Windows Kits/10/Lib/10.0.26100.0/um/x64"
]

[env]
VSINSTALLDIR = { value = "C:/Program Files (x86)/Microsoft Visual Studio/18/BuildTools/", force = true }
VCINSTALLDIR = { value = "C:/Program Files (x86)/Microsoft Visual Studio/18/BuildTools/VC/", force = true }
VCToolsInstallDir = { value = "C:/Program Files (x86)/Microsoft Visual Studio/18/BuildTools/VC/Tools/MSVC/14.50.35717/", force = true }
VCToolsVersion = { value = "14.50.35717", force = true }
VisualStudioVersion = { value = "18.0", force = true }
CC_x86_64_pc_windows_msvc = { value = "C:/Program Files (x86)/Microsoft Visual Studio/18/BuildTools/VC/Tools/MSVC/14.50.35717/bin/Hostx64/x64/cl.exe", force = true }
CXX_x86_64_pc_windows_msvc = { value = "C:/Program Files (x86)/Microsoft Visual Studio/18/BuildTools/VC/Tools/MSVC/14.50.35717/bin/Hostx64/x64/cl.exe", force = true }
AR_x86_64_pc_windows_msvc = { value = "C:/Program Files (x86)/Microsoft Visual Studio/18/BuildTools/VC/Tools/MSVC/14.50.35717/bin/Hostx64/x64/lib.exe", force = true }
WindowsSdkDir = { value = "C:/Program Files (x86)/Windows Kits/10/", force = true }
WindowsSDKVersion = { value = "10.0.26100.0/", force = true }
INCLUDE = { value = "C:/Program Files (x86)/Microsoft Visual Studio/18/BuildTools/VC/Tools/MSVC/14.50.35717/include;C:/Program Files (x86)/Windows Kits/10/Include/10.0.26100.0/ucrt;C:/Program Files (x86)/Windows Kits/10/Include/10.0.26100.0/shared;C:/Program Files (x86)/Windows Kits/10/Include/10.0.26100.0/um;C:/Program Files (x86)/Windows Kits/10/Include/10.0.26100.0/winrt", force = true }
